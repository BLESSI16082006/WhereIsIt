
name: whereisit
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  provider: ^6.1.5+1
  firebase_storage: ^13.4.6
  image_picker: ^1.2.2
  http: ^1.6.0
  google_mlkit_text_recognition: ^0.17.1
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/whereisit_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/whereisit_logo.png"
  adaptive_icon_background: "#0B1120"
  adaptive_icon_foreground: "assets/images/whereisit_logo.png"

